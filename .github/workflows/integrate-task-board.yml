name: Integrar módulo Afazeres

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - scripts/integrate_task_board.py
      - .github/workflows/integrate-task-board.yml
      - src/modules/tasks/**
      - src/types.ts
      - supabase/migrations/20260805183600_create_hub_tasks.sql

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout da branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/afazeres-board
          fetch-depth: 0

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Integrar tela ao aplicativo
        run: python scripts/integrate_task_board.py

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Validar build
        run: pnpm run build

      - name: Remover automação temporária
        run: rm -f scripts/integrate_task_board.py .github/workflows/integrate-task-board.yml

      - name: Publicar integração na branch
        run: |
          git config user.name "Sergio Tezzei"
          git config user.email "sergiotezzei@gmail.com"
          git add src/App.tsx src/types.ts src/modules/tasks supabase/migrations/20260805183600_create_hub_tasks.sql scripts/integrate_task_board.py .github/workflows/integrate-task-board.yml
          git commit -m "Integra quadro de Afazeres ao HUB [tasks-auto]"
          git push origin HEAD:chatgpt/afazeres-board
