name: One-time Locaweb email alert
on:
  push:
    branches:
      - feat/locaweb-email-alert
    paths:
      - '.github/workflows/one-time-locaweb-email-alert.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/locaweb-email-alert
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Add IMAP dependency
        run: pnpm add imapflow@1.7.1 --save-exact
      - name: Patch Alerts UI
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/modules/alerts/AlertDashboardEnhancer.tsx')
          text = path.read_text()

          import_marker = 'import { completeAlertTask, loadAlertTasks, type AlertTask } from "./alertTaskService";\n'
          import_add = '''import {
            acknowledgeEmailInbox,
            loadEmailInboxStatus,
            saveEmailInboxConfig,
            type EmailInboxStatus,
          } from "./emailInboxService";
          '''
          if import_marker not in text:
              raise SystemExit('import marker not found')
          text = text.replace(import_marker, import_marker + import_add, 1)

          state_marker = '  const [deletingId, setDeletingId] = useState("");\n'
          state_add = '''  const [emailInbox, setEmailInbox] = useState<EmailInboxStatus | null>(null);
            const [emailAddress, setEmailAddress] = useState("");
            const [emailPassword, setEmailPassword] = useState("");
            const [emailSaving, setEmailSaving] = useState(false);
          '''
          if state_marker not in text:
              raise SystemExit('state marker not found')
          text = text.replace(state_marker, state_marker + state_add, 1)

          pending_marker = '  const pendingAlerts = useMemo(\n'
          email_effect = '''  useEffect(() => {
            let active = true;

            const refreshEmailStatus = async () => {
              try {
                const status = await loadEmailInboxStatus();
                if (!active) return;
                setEmailInbox(status);
                setEmailAddress((current) => current || status.emailAddress);
              } catch {
                // O monitor de e-mail é independente dos demais Alertas.
              }
            };

            void refreshEmailStatus();
            const intervalId = window.setInterval(() => { void refreshEmailStatus(); }, 60_000);
            const onFocus = () => { void refreshEmailStatus(); };
            window.addEventListener("focus", onFocus);

            return () => {
              active = false;
              window.clearInterval(intervalId);
              window.removeEventListener("focus", onFocus);
            };
          }, []);

          '''
          if pending_marker not in text:
              raise SystemExit('pending marker not found')
          text = text.replace(pending_marker, email_effect + pending_marker, 1)

          total_old = '  const totalPending = pendingAlerts.length + alertTasks.length;'
          total_new = '  const totalPending = pendingAlerts.length + alertTasks.length + (emailInbox?.pendingNewCount ? 1 : 0);'
          if total_old not in text:
              raise SystemExit('total pending marker not found')
          text = text.replace(total_old, total_new, 1)

          return_marker = '  return (\n    <section className="hub-alert-panel" aria-label="Alertas e rotinas recorrentes">'
          handlers = '''  async function saveEmailConfiguration(event: FormEvent<HTMLFormElement>) {
            event.preventDefault();
            const email = emailAddress.trim();
            if (!email || !email.includes("@")) {
              setMessage("Informe o e-mail completo da Locaweb.");
              return;
            }
            if (!emailPassword) {
              setMessage("Informe a senha da caixa de e-mail para salvar a configuração.");
              return;
            }

            setEmailSaving(true);
            setMessage("");
            try {
              await saveEmailInboxConfig(email, emailPassword);
              setEmailPassword("");
              setMessage("E-mail Locaweb configurado. A primeira verificação será feita em instantes.");
              const status = await loadEmailInboxStatus();
              setEmailInbox(status);
              setEmailAddress(status.emailAddress || email);
            } catch {
              setMessage("Não foi possível salvar a configuração do e-mail.");
            } finally {
              setEmailSaving(false);
            }
          }

            async function openEmailInbox() {
              window.open("https://webmail-seguro.com.br/", "_blank", "noopener,noreferrer");
              try {
                await acknowledgeEmailInbox();
                setEmailInbox((current) => current ? { ...current, pendingNewCount: 0 } : current);
              } catch {
                // O Webmail já foi aberto; a confirmação pode ser refeita na próxima vez.
              }
            }

          '''
          if return_marker not in text:
              raise SystemExit('return marker not found')
          text = text.replace(return_marker, handlers + return_marker, 1)

          cards_marker = '      <div className="hub-alert-cards">\n'
          email_card = '''      <div className="hub-alert-cards">
            {emailInbox && emailInbox.pendingNewCount > 0 && (
              <article className="hub-alert-card is-email">
                <div className="hub-alert-card-status">
                  <span>NOVO E-MAIL</span>
                  <time>CAIXA DE ENTRADA</time>
                </div>
                <h3>📧 Você tem e-mail novo</h3>
                <p>{emailInbox.pendingNewCount === 1 ? "Chegou 1 novo e-mail na sua caixa de entrada." : `Chegaram ${emailInbox.pendingNewCount} novos e-mails na sua caixa de entrada.`}</p>
                <small>O HUB detecta somente que chegou mensagem nova. Assunto, remetente, conteúdo e anexos não são lidos nem armazenados.</small>
                <button className="hub-alert-email-button" type="button" onClick={() => { void openEmailInbox(); }}>ABRIR WEBMAIL</button>
              </article>
            )}
          '''
          if cards_marker not in text:
              raise SystemExit('cards marker not found')
          text = text.replace(cards_marker, email_card, 1)

          form_marker = '            <form className="hub-alert-form" onSubmit={saveRule}>\n'
          email_config = '''            <section className="hub-email-config">
              <div className="hub-email-config-head">
                <div>
                  <p className="hub-alert-kicker">CAIXA DE ENTRADA</p>
                  <h3>E-mail Locaweb</h3>
                </div>
                <span className={emailInbox?.configured ? "is-connected" : ""}>{emailInbox?.configured ? "MONITOR ATIVO" : "NÃO CONFIGURADO"}</span>
              </div>
              <p>O HUB verifica a cada 5 minutos somente se chegou mensagem nova. Não lê assunto, remetente, conteúdo nem anexos.</p>
              <form className="hub-email-config-form" onSubmit={saveEmailConfiguration}>
                <label>
                  E-mail
                  <input type="email" autoComplete="username" value={emailAddress} placeholder="seuemail@santamariatem.com.br" onChange={(event) => setEmailAddress(event.target.value)} />
                </label>
                <label>
                  Senha da caixa de e-mail
                  <input type="password" autoComplete="current-password" value={emailPassword} placeholder={emailInbox?.configured ? "Digite apenas para atualizar a senha" : "Senha do e-mail"} onChange={(event) => setEmailPassword(event.target.value)} />
                </label>
                <button type="submit" disabled={emailSaving}>{emailSaving ? "SALVANDO..." : emailInbox?.configured ? "ATUALIZAR E TESTAR" : "SALVAR E TESTAR"}</button>
              </form>
              {emailInbox?.configured && <small>Conta monitorada: <strong>{emailInbox.emailAddress}</strong></small>}
              {emailInbox?.lastCheckedAt && <small>Última verificação: {new Date(emailInbox.lastCheckedAt).toLocaleString("pt-BR")}</small>}
              {emailInbox?.lastError && <p className="hub-email-config-error">{emailInbox.lastError}</p>}
            </section>

            <form className="hub-alert-form" onSubmit={saveRule}>
          '''
          if form_marker not in text:
              raise SystemExit('form marker not found')
          text = text.replace(form_marker, email_config, 1)

          path.write_text(text)

          css = Path('src/modules/alerts/alerts.css')
          css_text = css.read_text()
          css_text += '''

          .hub-alert-card.is-email {
            border-color: #2563eb;
            background: #eff6ff;
            animation: hub-email-pulse 1.8s ease-in-out infinite;
          }

          .is-email .hub-alert-card-status span {
            background: #2563eb;
            color: #fff;
          }

          .hub-alert-email-button {
            width: 100%;
            margin-top: auto;
            padding: 11px 14px;
            border: 0;
            border-radius: 12px;
            background: #1d4ed8;
            color: #fff;
            font-weight: 900;
            letter-spacing: 0.04em;
            cursor: pointer;
          }

          .hub-email-config {
            display: grid;
            gap: 10px;
            margin-top: 18px;
            padding: 16px;
            border: 1px solid rgba(37, 99, 235, 0.22);
            border-radius: 15px;
            background: #f8fbff;
          }

          .hub-email-config-head {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px;
          }

          .hub-email-config-head h3 {
            margin: 2px 0 0;
          }

          .hub-email-config-head > span {
            padding: 5px 8px;
            border-radius: 999px;
            background: #e5e7eb;
            font-size: 0.68rem;
            font-weight: 900;
          }

          .hub-email-config-head > span.is-connected {
            background: #dcfce7;
            color: #166534;
          }

          .hub-email-config > p,
          .hub-email-config > small {
            margin: 0;
            line-height: 1.4;
          }

          .hub-email-config-form {
            display: grid;
            grid-template-columns: 1fr 1fr auto;
            gap: 9px;
            align-items: end;
          }

          .hub-email-config-form label {
            display: grid;
            gap: 5px;
            font-size: 0.78rem;
            font-weight: 800;
          }

          .hub-email-config-form input {
            min-height: 42px;
            box-sizing: border-box;
            padding: 9px 10px;
            border: 1px solid rgba(15, 23, 42, 0.2);
            border-radius: 9px;
            background: #fff;
            font: inherit;
          }

          .hub-email-config-form button {
            min-height: 42px;
            padding: 9px 12px;
            border: 0;
            border-radius: 9px;
            background: #1d4ed8;
            color: #fff;
            font-weight: 900;
            cursor: pointer;
          }

          .hub-email-config-form button:disabled {
            cursor: wait;
            opacity: 0.6;
          }

          .hub-email-config-error {
            padding: 8px 10px;
            border-radius: 9px;
            background: #fff1f2;
            color: #b91c1c;
            font-size: 0.78rem;
            font-weight: 800;
          }

          @keyframes hub-email-pulse {
            0%, 100% { box-shadow: 0 8px 24px rgba(37, 99, 235, 0.12); transform: translateY(0); }
            50% { box-shadow: 0 12px 34px rgba(37, 99, 235, 0.30); transform: translateY(-2px); }
          }

          @media (max-width: 700px) {
            .hub-email-config-form {
              grid-template-columns: 1fr;
            }
          }

          @media (prefers-reduced-motion: reduce) {
            .hub-alert-card.is-email {
              animation: none;
            }
          }
          '''
          css.write_text(css_text)

      - run: pnpm run build
      - run: npx tsc --noEmit
      - name: Privacy checks
        run: |
          ! grep -R "fetchOne\|envelope\|source\|subject\|from:" api/email-inbox-check.ts
          grep -q 'client.status("INBOX"' api/email-inbox-check.ts
      - name: Commit verified implementation
        run: |
          rm .github/workflows/one-time-locaweb-email-alert.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(alerts): avisar novos e-mails da Locaweb'
          git push origin HEAD:feat/locaweb-email-alert
