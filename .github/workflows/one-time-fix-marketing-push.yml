name: Validate Marketing push fix

on:
  push:
    branches:
      - fix/marketing-push-permission-expiry
    paths:
      - '.github/workflows/one-time-fix-marketing-push.yml'

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: npx tsc --noEmit
      - name: Clean temporary implementation files
        run: |
          rm -f .github/workflows/one-time-fix-marketing-push.yml
          rm -f .github/workflows/one-time-marketing-cancel-button.yml
          rm -f docs/marketing-cancel-button-plan.md docs/marketing-cancel-button-ready.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "chore: limpar arquivos temporários de implantação"
          git push origin HEAD:fix/marketing-push-permission-expiry
