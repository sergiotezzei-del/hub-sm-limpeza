name: One-time Marketing push fix

on:
  push:
    branches:
      - fix/marketing-push-permission-expiry
    paths:
      - '.github/workflows/one-time-fix-marketing-push.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix Marketing push permission and expiry flow
        shell: python
        run: |
          from pathlib import Path

          client_path = Path('src/modules/marketing/marketingPushClient.ts')
          client = client_path.read_text(encoding='utf-8')

          old = '''export type MarketingPushSetup = {
            claimToken: string;
            pairCode: string;
            requestNumber: number;
            expiresAt: string;
          };'''
          new = '''export type MarketingPushSetup = {
            claimToken: string;
            pairCode: string;
            requestNumber: number;
            expiresAt: string;
            submissionId?: string;
          };'''
          if old not in client:
              raise SystemExit('MarketingPushSetup block not found')
          client = client.replace(old, new, 1)

          old = '''  const setup: MarketingPushSetup = {
            claimToken: row.claim_token,
            pairCode: row.pair_code,
            requestNumber: Number(row.request_number),
            expiresAt: row.expires_at,
          };'''
          new = '''  const setup: MarketingPushSetup = {
            claimToken: row.claim_token,
            pairCode: row.pair_code,
            requestNumber: Number(row.request_number),
            expiresAt: row.expires_at,
            submissionId,
          };'''
          if old not in client:
              raise SystemExit('setup creation block not found')
          client = client.replace(old, new, 1)

          marker = '''export async function subscribeMarketingPush(setup: MarketingPushSetup | MarketingPushManualSetup) {
            if (!isWebPushSupported()) throw new Error("PUSH_UNSUPPORTED");'''
          replacement = '''export function isMarketingPushSetupExpired(setup: MarketingPushSetup, skewMs = 5000) {
            const expiresAt = Date.parse(setup.expiresAt);
            return Number.isFinite(expiresAt) && expiresAt <= Date.now() + skewMs;
          }

          export async function renewMarketingPushSetup(setup: MarketingPushSetup) {
            if (!isMarketingPushSetupExpired(setup)) return setup;
            if (!setup.submissionId) throw new Error("MARKETING_PUSH_CLAIM_INVALID");
            return prepareMarketingPush(setup.submissionId);
          }

          export async function subscribeMarketingPush(setup: MarketingPushSetup | MarketingPushManualSetup) {
            if (!isWebPushSupported()) throw new Error("PUSH_UNSUPPORTED");'''
          if marker not in client:
              raise SystemExit('subscribe marker not found')
          client = client.replace(marker, replacement, 1)

          old = '''  const publicKey = await loadVapidPublicKey();
            const registration = await navigator.serviceWorker.ready;'''
          new = '''  const effectiveSetup = "claimToken" in setup ? await renewMarketingPushSetup(setup) : setup;

            const publicKey = await loadVapidPublicKey();
            const registration = await navigator.serviceWorker.ready;'''
          if old not in client:
              raise SystemExit('public key block not found')
          client = client.replace(old, new, 1)

          old = '''      claimToken: "claimToken" in setup ? setup.claimToken : null,
                requestNumber: setup.requestNumber,
                pairCode: setup.pairCode,'''
          new = '''      claimToken: "claimToken" in effectiveSetup ? effectiveSetup.claimToken : null,
                requestNumber: effectiveSetup.requestNumber,
                pairCode: effectiveSetup.pairCode,'''
          if old not in client:
              raise SystemExit('subscribe payload block not found')
          client = client.replace(old, new, 1)

          old = '''      requestNumber,
                expiresAt: parsed.expiresAt || "",
              };'''
          new = '''      requestNumber,
                expiresAt: parsed.expiresAt || "",
                submissionId: typeof parsed.submissionId === "string" && parsed.submissionId ? parsed.submissionId : undefined,
              };'''
          if old not in client:
              raise SystemExit('safeSetup return block not found')
          client = client.replace(old, new, 1)
          client_path.write_text(client, encoding='utf-8')

          card_path = Path('src/modules/marketing/MarketingPushSetupCard.tsx')
          card = card_path.read_text(encoding='utf-8')

          old = '''  isIosDevice,
            isMarketingNotificationReceiver,
            isWebPushSupported,
            subscribeMarketingPush,'''
          new = '''  isIosDevice,
            isMarketingNotificationReceiver,
            isMarketingPushSetupExpired,
            isWebPushSupported,
            renewMarketingPushSetup,
            subscribeMarketingPush,'''
          if old not in card:
              raise SystemExit('card import block not found')
          card = card.replace(old, new, 1)

          old = '''  const [copyDone, setCopyDone] = useState(false);
            const ios = useMemo(() => isIosDevice(), []);'''
          new = '''  const [copyDone, setCopyDone] = useState(false);
            const [currentSetup, setCurrentSetup] = useState<MarketingPushSetup | null>(setup);
            const [permission, setPermission] = useState<NotificationPermission>(() => ("Notification" in window ? Notification.permission : "default"));
            const ios = useMemo(() => isIosDevice(), []);

            useEffect(() => {
              setCurrentSetup(setup);
            }, [setup]);

            useEffect(() => {
              const syncPermission = () => {
                if (!("Notification" in window)) return;
                const next = Notification.permission;
                setPermission(next);
                if (next !== "denied" && status === "error") {
                  setStatus("idle");
                  setMessage("");
                }
              };
              window.addEventListener("focus", syncPermission);
              document.addEventListener("visibilitychange", syncPermission);
              return () => {
                window.removeEventListener("focus", syncPermission);
                document.removeEventListener("visibilitychange", syncPermission);
              };
            }, [status]);

            useEffect(() => {
              if (!currentSetup || preparing || status !== "idle" || !isMarketingPushSetupExpired(currentSetup)) return;
              let active = true;
              setStatus("activating");
              setMessage("Atualizando o código de vinculação...");
              void renewMarketingPushSetup(currentSetup)
                .then((next) => {
                  if (!active) return;
                  setCurrentSetup(next);
                  setStatus("idle");
                  setMessage("Código de vinculação atualizado automaticamente.");
                })
                .catch((error) => {
                  if (!active) return;
                  setStatus("error");
                  setMessage(getMarketingPushErrorMessage(error));
                });
              return () => { active = false; };
            }, [currentSetup, preparing, status]);'''
          if old not in card:
              raise SystemExit('card state block not found')
          card = card.replace(old, new, 1)

          old = '''  useEffect(() => {
            if (!setup || status !== "idle" || !isMarketingNotificationReceiver()) return;
            if (!("Notification" in window) || Notification.permission !== "granted") return;
            setStatus("activating");
            void subscribeMarketingPush(setup)
              .then(() => {
                setStatus("active");
                setMessage("Este pedido já está vinculado às notificações deste aparelho.");
              })
              .catch((error) => {
                setStatus("error");
                setMessage(getMarketingPushErrorMessage(error));
              });
          }, [setup, status]);'''
          new = '''  useEffect(() => {
            if (!currentSetup || status !== "idle" || !isMarketingNotificationReceiver()) return;
            if (!("Notification" in window) || Notification.permission !== "granted") return;
            setStatus("activating");
            void subscribeMarketingPush(currentSetup)
              .then(() => {
                setStatus("active");
                setMessage("Este pedido já está vinculado às notificações deste aparelho.");
              })
              .catch((error) => {
                setStatus("error");
                setMessage(getMarketingPushErrorMessage(error));
              });
          }, [currentSetup, status]);'''
          if old not in card:
              raise SystemExit('auto subscribe effect not found')
          card = card.replace(old, new, 1)

          card = card.replace('if (!setup || status === "installing") return;', 'if (!currentSetup || status === "installing") return;', 1)

          old = '''  async function activateNotifications() {
            if (!setup || status === "activating") return;
            setStatus("activating");
            setMessage("");
            try {
              await subscribeMarketingPush(setup);
              setStatus("active");
              setMessage("Pronto. Este aparelho receberá a confirmação e os lembretes deste agendamento.");
            } catch (error) {
              setStatus("error");
              setMessage(getMarketingPushErrorMessage(error));
              if (isIosDevice() && !isPwaStandalone()) setGuideOpen(true);
            }
          }'''
          new = '''  async function activateNotifications() {
            if (!currentSetup || status === "activating") return;
            if (permission === "denied") {
              setStatus("error");
              setMessage("As notificações estão bloqueadas neste navegador. Libere a permissão nas configurações do site e volte a esta tela.");
              setGuideOpen(true);
              return;
            }
            setStatus("activating");
            setMessage("");
            try {
              const freshSetup = await renewMarketingPushSetup(currentSetup);
              setCurrentSetup(freshSetup);
              await subscribeMarketingPush(freshSetup);
              setStatus("active");
              setMessage("Pronto. Este aparelho receberá a confirmação e os lembretes deste agendamento.");
            } catch (error) {
              setStatus("error");
              setMessage(getMarketingPushErrorMessage(error));
              if (isIosDevice() && !isPwaStandalone()) setGuideOpen(true);
            }
          }'''
          if old not in card:
              raise SystemExit('activateNotifications block not found')
          card = card.replace(old, new, 1)

          old = '''  async function copyCode() {
            if (!setup) return;
            const text = `Pedido #${setup.requestNumber} · Código ${formatMarketingPairCode(setup.pairCode)}`;'''
          new = '''  async function copyCode() {
            if (!currentSetup) return;
            const text = `Pedido #${currentSetup.requestNumber} · Código ${formatMarketingPairCode(currentSetup.pairCode)}`;'''
          if old not in card:
              raise SystemExit('copyCode block not found')
          card = card.replace(old, new, 1)

          old = '''  const unsupported = !isWebPushSupported();
            const canActivateHere = Boolean(setup) && !unsupported && (!ios || standalone);'''
          new = '''  const unsupported = !isWebPushSupported();
            const canActivateHere = Boolean(currentSetup) && permission !== "denied" && !unsupported && (!ios || standalone);'''
          if old not in card:
              raise SystemExit('canActivateHere block not found')
          card = card.replace(old, new, 1)

          card = card.replace('{setup && !prepareFailed && (', '{currentSetup && !prepareFailed && (', 1)

          anchor = '''                {canActivateHere && (
                  <button type="button" className="marketing-push-primary marketing-push-activate" disabled={status === "activating"} onClick={() => { void activateNotifications(); }}>
                    {status === "activating" ? "ATIVANDO..." : installAvailable && !standalone ? "2. ATIVAR NOTIFICAÇÕES" : "ATIVAR NOTIFICAÇÕES NESTE APARELHO"}
                  </button>
                )}'''
          replacement = '''                {permission === "denied" && (
                  <button type="button" className="marketing-push-guide-button" onClick={() => setGuideOpen(true)}>
                    NOTIFICAÇÕES BLOQUEADAS — COMO LIBERAR
                  </button>
                )}

                {canActivateHere && (
                  <button type="button" className="marketing-push-primary marketing-push-activate" disabled={status === "activating"} onClick={() => { void activateNotifications(); }}>
                    {status === "activating" ? "ATIVANDO..." : installAvailable && !standalone ? "2. ATIVAR NOTIFICAÇÕES" : "ATIVAR NOTIFICAÇÕES NESTE APARELHO"}
                  </button>
                )}'''
          if anchor not in card:
              raise SystemExit('activate button block not found')
          card = card.replace(anchor, replacement, 1)

          card = card.replace('{guideOpen && setup && (', '{guideOpen && currentSetup && (', 1)
          card = card.replace('Pedido #{setup.requestNumber}', 'Pedido #{currentSetup.requestNumber}')
          card = card.replace('formatMarketingPairCode(setup.pairCode)', 'formatMarketingPairCode(currentSetup.pairCode)')
          card = card.replace('pedido <strong>#{setup.requestNumber}</strong>', 'pedido <strong>#{currentSetup.requestNumber}</strong>')
          card = card.replace('{unsupported && setup && (', '{unsupported && currentSetup && (', 1)

          guide_marker = '''              <div className="marketing-push-guide">
                <h3>Como fazer</h3>'''
          guide_replacement = '''              <div className="marketing-push-guide">
                <h3>Como fazer</h3>
                {permission === "denied" && (
                  <div className="marketing-push-error">
                    <strong>As notificações estão bloqueadas neste navegador.</strong>
                    <p>Abra as configurações deste site no Chrome/Edge, altere <strong>Notificações</strong> para <strong>Permitir</strong>, volte para esta tela e clique no botão abaixo.</p>
                    <button type="button" className="marketing-push-guide-button" onClick={() => {
                      const next = "Notification" in window ? Notification.permission : "default";
                      setPermission(next);
                      if (next !== "denied") { setStatus("idle"); setMessage(""); }
                    }}>JÁ LIBEREI NAS CONFIGURAÇÕES</button>
                  </div>
                )}'''
          if guide_marker not in card:
              raise SystemExit('guide marker not found')
          card = card.replace(guide_marker, guide_replacement, 1)
          card_path.write_text(card, encoding='utf-8')

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: npx tsc --noEmit
      - name: Commit verified fix and clean temporary files
        run: |
          rm -f .github/workflows/one-time-fix-marketing-push.yml
          rm -f .github/workflows/one-time-marketing-cancel-button.yml
          rm -f docs/marketing-cancel-button-plan.md docs/marketing-cancel-button-ready.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "fix(marketing): renovar vínculo push e tratar permissão bloqueada"
          git push origin HEAD:fix/marketing-push-permission-expiry
