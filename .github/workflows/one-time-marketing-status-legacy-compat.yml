name: One-time Marketing status legacy compatibility

on:
  push:
    branches:
      - fix/marketing-status-legacy-compat
    paths:
      - '.github/workflows/one-time-marketing-status-legacy-compat.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply Marketing frontend patch
        run: python scripts/one_time_marketing_status_legacy_compat.py
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: npx tsc --noEmit
      - run: git diff --check
      - name: Commit verified frontend change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/modules/marketing/MarketingFeature.tsx public/sw.js
          git diff --cached --quiet && exit 0
          git commit -m "fix(marketing): restaurar controle de status e compatibilidade legada"
          git push origin HEAD:fix/marketing-status-legacy-compat
