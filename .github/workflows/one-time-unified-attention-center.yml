name: One-time unified attention center

on:
  push:
    branches:
      - feat/unified-attention-center

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/unified-attention-center
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Patch unified attention center
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}: {old[:80]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Afazeres: concluir pelo fluxo oficial e deixar o nome do botão explícito.
          replace_once(
              'src/modules/tasks/services/taskService.ts',
              'export async function deleteHubTask(taskId: string): Promise<void> {',
              '''export async function completeHubTask(taskId: string, actorName: string): Promise<void> {\n  const completed = await requestJson<boolean>("rpc/complete_hub_task_and_source", {\n    method: "POST",\n    body: JSON.stringify({ p_task_id: taskId, p_actor_name: actorName }),\n  });\n  if (completed !== true) throw new HubTaskRemoteError(404, "Tarefa não encontrada ou já concluída.");\n}\n\nexport async function deleteHubTask(taskId: string): Promise<void> {'''
          )
          replace_once(
              'src/modules/tasks/TaskBoardScreen.tsx',
              '  deleteHubTask,\n',
              '  completeHubTask,\n  deleteHubTask,\n'
          )
          replace_once(
              'src/modules/tasks/TaskBoardScreen.tsx',
              '      await deleteHubTask(task.id);',
              '      await completeHubTask(task.id, currentUser.name);'
          )
          replace_once(
              'src/modules/tasks/TaskBoardScreen.tsx',
              '{inAlerts ? "Tirar dos alertas" : "Alertar"}',
              '{inAlerts ? "Tirar dos alertas" : "Mostrar nos alertas"}'
          )

          # Chamados: novo chamado entra automaticamente, mas pode ser ocultado/recolocado manualmente.
          replace_once(
              'src/modules/service-requests/ServiceRequestsScreen.tsx',
              'import { SantaMariaBrand } from "../../components/SantaMariaBrand";\n',
              'import { SantaMariaBrand } from "../../components/SantaMariaBrand";\nimport { loadAlertServiceRequestIds, setServiceRequestAlertVisibility } from "../alerts/alertServiceRequestService";\n'
          )
          replace_once(
              'src/modules/service-requests/ServiceRequestsScreen.tsx',
              '  const [busyRequestId, setBusyRequestId] = useState("");\n',
              '  const [busyRequestId, setBusyRequestId] = useState("");\n  const [alertRequestIds, setAlertRequestIds] = useState<string[]>([]);\n'
          )
          replace_once(
              'src/modules/service-requests/ServiceRequestsScreen.tsx',
              '''    try {\n      setDataset(await loadServiceRequestDataset());\n      setLoadState("ready");''',
              '''    try {\n      const [nextDataset, nextAlertRequestIds] = await Promise.all([\n        loadServiceRequestDataset(),\n        loadAlertServiceRequestIds(),\n      ]);\n      setDataset(nextDataset);\n      setAlertRequestIds(nextAlertRequestIds);\n      setLoadState("ready");'''
          )
          replace_once(
              'src/modules/service-requests/ServiceRequestsScreen.tsx',
              '  async function refreshEventsOnly() {',
              '''  async function toggleRequestAlert(request: ServiceRequest) {\n    if (busyRequestId) return;\n    const visible = !alertRequestIds.includes(request.id);\n    setBusyRequestId(`alert:${request.id}`);\n    setNotice("");\n    try {\n      await setServiceRequestAlertVisibility(request.id, visible, currentUser.name);\n      setAlertRequestIds((current) => visible\n        ? [...new Set([...current, request.id])]\n        : current.filter((id) => id !== request.id));\n      setNotice(visible ? "Chamado adicionado aos Alertas." : "Chamado retirado dos Alertas.");\n    } catch (error) {\n      setNotice(getAdminServiceRequestErrorMessage(error));\n    } finally {\n      setBusyRequestId("");\n    }\n  }\n\n  async function refreshEventsOnly() {'''
          )
          replace_once(
              'src/modules/service-requests/ServiceRequestsScreen.tsx',
              '''              <button className="secondary-button" type="button" onClick={() => void saveNote(selectedRequest)} disabled={Boolean(busyRequestId)}>\n                Salvar observação\n              </button>\n              {renderStatusActions(selectedRequest, busyRequestId, changeStatus)}''',
              '''              <button className="secondary-button" type="button" onClick={() => void saveNote(selectedRequest)} disabled={Boolean(busyRequestId)}>\n                Salvar observação\n              </button>\n              <button\n                className="secondary-button"\n                type="button"\n                onClick={() => { void toggleRequestAlert(selectedRequest); }}\n                disabled={Boolean(busyRequestId)}\n              >\n                {alertRequestIds.includes(selectedRequest.id) ? "Tirar dos alertas" : "Mostrar nos alertas"}\n              </button>\n              {renderStatusActions(selectedRequest, busyRequestId, changeStatus)}'''
          )

          # Painel: carrega Chamados e eventos operacionais junto com rotinas e Afazeres.
          replace_once(
              'src/modules/alerts/AlertDashboardEnhancer.tsx',
              'import { completeAlertTask, loadAlertTasks, type AlertTask } from "./alertTaskService";\n',
              'import { completeAlertTask, loadAlertTasks, type AlertTask } from "./alertTaskService";\nimport { completeAlertServiceRequest, loadAlertServiceRequests, type AlertServiceRequest } from "./alertServiceRequestService";\nimport { acknowledgeAttentionEvent, loadAttentionEvents, type AttentionEvent } from "./attentionEventService";\n'
          )
          replace_once(
              'src/modules/alerts/AlertDashboardEnhancer.tsx',
              '  const [alertTasks, setAlertTasks] = useState<AlertTask[]>([]);\n',
              '  const [alertTasks, setAlertTasks] = useState<AlertTask[]>([]);\n  const [alertServiceRequests, setAlertServiceRequests] = useState<AlertServiceRequest[]>([]);\n  const [attentionEvents, setAttentionEvents] = useState<AttentionEvent[]>([]);\n'
          )
          replace_once(
              'src/modules/alerts/AlertDashboardEnhancer.tsx',
              '  useEffect(() => {\n  let active = true;\n\n  const refreshEmailStatus = async () => {',
              '''  useEffect(() => {\n    let active = true;\n    Promise.allSettled([loadAlertServiceRequests(), loadAttentionEvents()]).then(([requestsResult, eventsResult]) => {\n      if (!active) return;\n      if (requestsResult.status === "fulfilled") setAlertServiceRequests(requestsResult.value);\n      if (eventsResult.status === "fulfilled") setAttentionEvents(eventsResult.value);\n      if (requestsResult.status === "rejected" || eventsResult.status === "rejected") {\n        setMessage((current) => current || "Parte dos avisos operacionais está temporariamente indisponível.");\n      }\n    });\n    return () => { active = false; };\n  }, []);\n\n  useEffect(() => {\n  let active = true;\n\n  const refreshEmailStatus = async () => {'''
          )
          replace_once(
              'src/modules/alerts/AlertDashboardEnhancer.tsx',
              '  const totalPending = pendingAlerts.length + alertTasks.length + (emailInbox?.pendingNewCount ? 1 : 0);',
              '  const totalPending = pendingAlerts.length + alertTasks.length + alertServiceRequests.length + attentionEvents.length + (emailInbox?.pendingNewCount ? 1 : 0);'
          )
          replace_once(
              'src/modules/alerts/AlertDashboardEnhancer.tsx',
              '  async function saveRule(event: FormEvent<HTMLFormElement>) {',
              '''  async function markServiceRequestDone(request: AlertServiceRequest) {\n    const key = `request:${request.id}`;\n    if (markingKey) return;\n    setMarkingKey(key);\n    setMessage("");\n    try {\n      await completeAlertServiceRequest(request.id);\n      setAlertServiceRequests((current) => current.filter((item) => item.id !== request.id));\n      setMessage(`Chamado #${request.protocolNumber} concluído e removido de Chamados.`);\n    } catch {\n      setMessage("Não foi possível concluir o Chamado.");\n    } finally {\n      setMarkingKey("");\n    }\n  }\n\n  async function acknowledgeOperationalEvent(event: AttentionEvent) {\n    const key = `event:${event.id}`;\n    if (markingKey) return;\n    setMarkingKey(key);\n    setMessage("");\n    try {\n      await acknowledgeAttentionEvent(event.id, ACTOR_NAME);\n      setAttentionEvents((current) => current.filter((item) => item.id !== event.id));\n      setMessage("Aviso retirado do painel.");\n    } catch {\n      setMessage("Não foi possível confirmar o aviso.");\n    } finally {\n      setMarkingKey("");\n    }\n  }\n\n  async function saveRule(event: FormEvent<HTMLFormElement>) {'''
          )
          replace_once(
              'src/modules/alerts/AlertDashboardEnhancer.tsx',
              '<section className="hub-alert-panel" aria-label="Alertas e rotinas recorrentes">',
              '<section className="hub-alert-panel" aria-label="Central de alertas e pendências">'
          )
          replace_once(
              'src/modules/alerts/AlertDashboardEnhancer.tsx',
              '<p className="hub-alert-kicker">ROTINAS DO DIA</p>',
              '<p className="hub-alert-kicker">PAINEL DO DIA</p>'
          )
          replace_once(
              'src/modules/alerts/AlertDashboardEnhancer.tsx',
              '<span>As próximas rotinas e Afazeres marcados aparecerão aqui.</span>',
              '<span>Rotinas, Afazeres, Chamados e novos avisos operacionais aparecerão aqui.</span>'
          )
          replace_once(
              'src/modules/alerts/AlertDashboardEnhancer.tsx',
              '        {alertTasks.map((task) => {',
              '''        {alertServiceRequests.map((request) => {\n          const key = `request:${request.id}`;\n          return (\n            <article className="hub-alert-card is-service-request" key={key}>\n              <div className="hub-alert-card-status">\n                <span>NOVO CHAMADO</span>\n                <time>#{request.protocolNumber}</time>\n              </div>\n              <h3>{request.requesterName}</h3>\n              <p>{request.requestText}</p>\n              <small>Chamados · {request.department} · {formatDateTimeShort(request.openedAt)}</small>\n              <button\n                className="hub-alert-done-button"\n                type="button"\n                disabled={Boolean(markingKey)}\n                onClick={() => { void markServiceRequestDone(request); }}\n              >\n                {markingKey === key ? "Salvando..." : "FEITO"}\n              </button>\n            </article>\n          );\n        })}\n\n        {attentionEvents.map((event) => {\n          const key = `event:${event.id}`;\n          const isOrder = event.sourceType === "order";\n          return (\n            <article className="hub-alert-card is-operational" key={key}>\n              <div className="hub-alert-card-status">\n                <span>{isOrder ? "NOVO PEDIDO" : "CONFERÊNCIA"}</span>\n                <time>{formatDateTimeShort(event.createdAt)}</time>\n              </div>\n              <h3>{event.title}</h3>\n              {event.description && <p>{event.description}</p>}\n              <small>{isOrder ? "Pedidos / Estoque" : "Conferência de estoque"}</small>\n              <button\n                className="hub-alert-done-button"\n                type="button"\n                disabled={Boolean(markingKey)}\n                onClick={() => { void acknowledgeOperationalEvent(event); }}\n              >\n                {markingKey === key ? "Salvando..." : "CIENTE"}\n              </button>\n            </article>\n          );\n        })}\n\n        {alertTasks.map((task) => {'''
          )
          replace_once(
              'src/modules/alerts/AlertDashboardEnhancer.tsx',
              'function getTodayIso() {',
              '''function formatDateTimeShort(value: string) {\n  return new Intl.DateTimeFormat("pt-BR", {\n    timeZone: "America/Sao_Paulo",\n    day: "2-digit",\n    month: "2-digit",\n    hour: "2-digit",\n    minute: "2-digit",\n  }).format(new Date(value));\n}\n\nfunction getTodayIso() {'''
          )

          # Remove este workflow de uso único do resultado final.
          Path('.github/workflows/one-time-unified-attention-center.yml').unlink()
          PY
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: npx tsc --noEmit
      - name: Commit verified implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(alerts): centralizar afazeres chamados e avisos" || exit 0
          git push origin HEAD:feat/unified-attention-center
