name: One-time unified attention center

on:
  push:
    branches:
      - feat/unified-attention-center

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/unified-attention-center
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Apply attention center patch
        run: python scripts/apply-unified-attention-center.py
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: npx tsc --noEmit
      - name: Commit verified implementation
        run: |
          rm -f scripts/apply-unified-attention-center.py .github/workflows/one-time-unified-attention-center.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(alerts): centralizar afazeres chamados e avisos" || exit 0
          git push origin HEAD:feat/unified-attention-center
