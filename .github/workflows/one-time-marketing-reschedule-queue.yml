name: One-time Marketing reschedule queue

on:
  push:
    branches:
      - feat/marketing-reagendar-fim-fila

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/marketing-reagendar-fim-fila
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Patch Marketing reschedule UI
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}: {old[:100]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          service = 'src/modules/marketing/marketingService.ts'
          feature = 'src/modules/marketing/MarketingFeature.tsx'
          css = Path('src/modules/marketing/marketing.css')

          replace_once(
              service,
              '''export async function requestMarketingQueueOverride(sessionToken: string, requestId: string, reason: string) {''',
              '''export async function rescheduleMarketingRequest(sessionToken: string, requestId: string) {\n  await rpc<unknown>("marketing_v2_reschedule_request", {\n    p_session_token: sessionToken,\n    p_request_id: requestId,\n  });\n}\n\nexport async function requestMarketingQueueOverride(sessionToken: string, requestId: string, reason: string) {'''
          )

          replace_once(
              service,
              '''  if (normalized.includes("MARKETING_ADMIN_REQUIRED")) return "Somente o administrador do Marketing pode realizar esta ação.";''',
              '''  if (normalized.includes("MARKETING_ADMIN_REQUIRED")) return "Somente o administrador do Marketing pode realizar esta ação.";\n  if (normalized.includes("MARKETING_RESCHEDULE_DENIED")) return "Somente Maria e Arthur podem reagendar pedidos do Marketing.";\n  if (normalized.includes("MARKETING_RESCHEDULE_CAPTURE_ONLY")) return "Somente pedidos com captação podem ser reagendados.";\n  if (normalized.includes("MARKETING_RESCHEDULE_NOT_SCHEDULED")) return "Este pedido não está mais agendado. Atualize o Marketing e confira a fila.";'''
          )

          replace_once(
              feature,
              '''  requestMarketingQueueOverride,\n  resolveMarketingManagerReview,''',
              '''  requestMarketingQueueOverride,\n  rescheduleMarketingRequest,\n  resolveMarketingManagerReview,'''
          )

          replace_once(
              feature,
              '''  async function requestOverride(event: FormEvent) {''',
              '''  async function rescheduleRequest() {\n    if (busy) return;\n    if (!window.confirm("Reagendar este pedido? O agendamento atual será liberado e o pedido irá para o FINAL DA FILA para receber uma nova data disponível.")) return;\n    setBusy(true);\n    props.onError("");\n    try {\n      await rescheduleMarketingRequest(props.sessionToken, props.request.id);\n      props.onNotice(`Pedido #${props.request.requestNumber} voltou para o final da fila de agendamento.`);\n      await props.onChanged();\n      props.onClose();\n    } catch (error) {\n      props.onError(getMarketingErrorMessage(error));\n    } finally {\n      setBusy(false);\n    }\n  }\n\n  async function requestOverride(event: FormEvent) {'''
          )

          replace_once(
              feature,
              '''        {(props.dashboard.context.userId === "arthur" || props.dashboard.context.userId === "maria") && !["pronto", "cancelado"].includes(props.request.status) && <button type="button" className="marketing-cancel-request" disabled={busy} onClick={() => { if (window.confirm("Cancelar este agendamento? O pedido ficará como cancelado e sairá da agenda.")) void run("cancel", { reason: "Cancelado pelo Marketing a pedido do corretor." }); }}>CANCELAR AGENDAMENTO</button>}''',
              '''        {(props.dashboard.context.userId === "arthur" || props.dashboard.context.userId === "maria") && props.request.status === "agendado" && props.request.requestKind === "capture_edit" && Boolean(props.request.confirmedCaptureAt) && <button type="button" className="marketing-reschedule-request" disabled={busy} onClick={() => { void rescheduleRequest(); }}>REAGENDAR PEDIDO</button>}\n        {(props.dashboard.context.userId === "arthur" || props.dashboard.context.userId === "maria") && !["pronto", "cancelado"].includes(props.request.status) && <button type="button" className="marketing-cancel-request" disabled={busy} onClick={() => { if (window.confirm("Cancelar este agendamento? O pedido ficará como cancelado e sairá da agenda.")) void run("cancel", { reason: "Cancelado pelo Marketing a pedido do corretor." }); }}>CANCELAR AGENDAMENTO</button>}'''
          )

          css.write_text(css.read_text(encoding='utf-8') + '''\n\n.marketing-reschedule-request {\n  margin: 4px 22px 10px;\n  border: 1px solid #b9addf;\n  border-radius: 10px;\n  padding: 9px 12px;\n  background: #f6f3ff;\n  color: #4f35a5;\n  font: inherit;\n  font-weight: 850;\n  cursor: pointer;\n}\n\n.marketing-reschedule-request:disabled {\n  opacity: .55;\n  cursor: wait;\n}\n''', encoding='utf-8')

          Path('.github/workflows/one-time-marketing-reschedule-queue.yml').unlink()
          PY
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: npx tsc --noEmit
      - run: git diff --check
      - name: Commit verified implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(marketing): reagendar pedido para o fim da fila"
          git push origin HEAD:feat/marketing-reagendar-fim-fila
