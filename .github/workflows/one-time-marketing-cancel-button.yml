name: One-time Marketing cancel button

on:
  push:
    paths:
      - '.github/workflows/one-time-marketing-cancel-button.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Expose cancel button to Arthur and Maria
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/modules/marketing/MarketingFeature.tsx')
          text = path.read_text(encoding='utf-8')
          old = '''        {!canManage && !["pronto", "cancelado"].includes(props.request.status) && <button type="button" className="marketing-cancel-request" disabled={busy} onClick={() => void run("cancel")}>Cancelar pedido</button>}'''
          new = '''        {(props.dashboard.context.userId === "arthur" || props.dashboard.context.userId === "maria") && !["pronto", "cancelado"].includes(props.request.status) && <button type="button" className="marketing-cancel-request" disabled={busy} onClick={() => { if (window.confirm("Cancelar este agendamento? O pedido ficará como cancelado e sairá da agenda.")) void run("cancel", { reason: "Cancelado pelo Marketing a pedido do corretor." }); }}>CANCELAR AGENDAMENTO</button>}\n        {!canManage && !["pronto", "cancelado"].includes(props.request.status) && <button type="button" className="marketing-cancel-request" disabled={busy} onClick={() => void run("cancel")}>Cancelar pedido</button>}'''
          if old not in text:
              raise SystemExit('Trecho esperado não encontrado; nenhuma alteração aplicada.')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: npx tsc --noEmit
      - name: Commit verified change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/modules/marketing/MarketingFeature.tsx
          git diff --cached --quiet && exit 0
          git commit -m "feat(marketing): permitir Arthur e Maria cancelar agendamentos"
          git push origin HEAD:main
