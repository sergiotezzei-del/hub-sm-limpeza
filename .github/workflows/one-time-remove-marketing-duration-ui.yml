name: One-time remove Marketing duration UI

on:
  push:
    branches:
      - fix/marketing-agenda-ui-simplificada

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/marketing-agenda-ui-simplificada
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Apply final UI cleanup
        run: python scripts/one_time_remove_marketing_duration_ui.py
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm run build
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Verify no visible duration controls
        run: |
          ! grep -R -n -E "Duração estimada|Duração solicitada|horário e a duração" src/modules/marketing --include='*.tsx' --include='*.ts'
          grep -q "Mesmo dia e horário da saída do primeiro imóvel" src/modules/marketing/PublicMarketingRequestPage.tsx
          grep -q "PRECISO DE ENCAIXE" src/modules/marketing/CaptureSchedulePicker.tsx
          grep -q "HORÁRIO FORA DO PADRÃO" src/modules/marketing/MarketingFeature.tsx
      - name: Commit verified implementation
        run: |
          rm -f scripts/one_time_remove_marketing_duration_ui.py
          rm -f .github/workflows/one-time-remove-marketing-duration-ui.yml
          git config user.name "Sergio Tezzei"
          git config user.email "sergiotezzei@gmail.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "refactor(marketing): remover duracao das telas de agenda"
          git push origin HEAD:fix/marketing-agenda-ui-simplificada
