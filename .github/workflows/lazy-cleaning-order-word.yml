name: Word sob demanda

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize
      - reopened
    paths:
      - scripts/lazy_load_cleaning_order_word.py
      - .github/workflows/lazy-cleaning-order-word.yml

permissions:
  contents: write

jobs:
  lazy-build-clean:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout da branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/pedido-word-thelma
          fetch-depth: 0

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Configurar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Aplicar carregamento sob demanda
        run: python scripts/lazy_load_cleaning_order_word.py

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Validar build
        run: pnpm run build

      - name: Remover arquivos temporários
        run: rm -f scripts/lazy_load_cleaning_order_word.py .github/workflows/lazy-cleaning-order-word.yml

      - name: Publicar ajuste real
        run: |
          git config user.name "Sergio Tezzei"
          git config user.email "sergiotezzei@gmail.com"
          git add -A
          git commit -m "Carrega gerador Word somente ao baixar"
          git push origin HEAD:chatgpt/pedido-word-thelma
