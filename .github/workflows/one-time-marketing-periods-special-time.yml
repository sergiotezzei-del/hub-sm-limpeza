name: One-time Marketing periods and special time

on:
  push:
    branches:
      - feat/marketing-periodos-horario-especial

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/marketing-periodos-horario-especial
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Align patch source
        run: python3 .github/scripts/fix_marketing_patch_source.py
      - name: Apply frontend patch
        run: python3 .github/scripts/apply_marketing_periods_special.py
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm run build
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Diff check
        run: git diff --check
      - name: Commit verified implementation
        run: |
          rm .github/workflows/one-time-marketing-periods-special-time.yml
          rm .github/scripts/apply_marketing_periods_special.py
          rm .github/scripts/fix_marketing_patch_source.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "feat(marketing): limitar agenda por período e aprovar exceções"
          git push origin HEAD:feat/marketing-periodos-horario-especial
