name: Compactar cards de Afazeres

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - scripts/compact_task_cards.py
      - .github/workflows/compact-task-cards.yml

permissions:
  contents: write

jobs:
  compactar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout da branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/compactar-cards-afazeres
          fetch-depth: 0

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Aplicar ajustes
        run: python scripts/compact_task_cards.py

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Validar build
        run: pnpm run build

      - name: Remover automação temporária
        run: rm -f scripts/compact_task_cards.py .github/workflows/compact-task-cards.yml

      - name: Publicar alterações reais
        run: |
          git config user.name "Sergio Tezzei"
          git config user.email "sergiotezzei@gmail.com"
          git add src/modules/tasks/TaskBoardScreen.tsx src/modules/tasks/taskBoard.css scripts/compact_task_cards.py .github/workflows/compact-task-cards.yml
          git commit -m "Compacta cards e prioriza urgentes nos Afazeres [cards-auto]"
          git push origin HEAD:chatgpt/compactar-cards-afazeres
