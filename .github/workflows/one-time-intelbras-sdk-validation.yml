name: One-time Intelbras SDK validation

on:
  push:
    branches:
      - feat/intelbras-sdk-official
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Intelbras protocol tests
        run: pnpm run test:intelbras
      - name: TypeScript and Vite build
        run: pnpm run build
      - name: Diff check
        run: git diff --check
